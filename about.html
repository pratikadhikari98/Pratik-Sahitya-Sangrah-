<!DOCTYPE html>
<html lang="ne" data-theme="light" data-htheme="kalika">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>बारेमा — प्रतीक साहित्य संग्रह</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2d1e46" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/about.css" />
  <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <button class="icon-btn back-btn" onclick="history.back()">
      ← <span style="font-size:13px;">फर्कनुस्</span>
    </button>
  </div>
  <div class="header-left">
    <div class="logo-text">
      <span class="logo-main">बारेमा</span>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="themeBtn">🌙</button>
  </div>
</header>

<!-- PROFILE -->
<section class="profile-card">
  <div class="profile-photo-wrap">
    <img class="profile-photo" id="profilePhoto" src="" alt="" onerror="this.style.display='none'" />
  </div>
  <h1 class="profile-name" id="profileName"></h1>
  <p class="profile-subtitle" id="profileSubtitle"></p>
  <div class="profile-location" id="profileLocation"></div>
</section>

<!-- DETAILS -->
<section class="about-section about-contact-section">
  <div class="about-section-label">📇 विवरण</div>
  <div class="about-contact" id="aboutContact"></div>
</section>

<!-- OTHER WEBSITES -->
<section class="about-section about-sites-section">
  <div class="about-section-label">🌐 अन्य वेबसाइटहरू</div>
  <div class="about-sites" id="aboutSites"></div>
</section>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='index.html'">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">गृहपृष्ठ</span>
  </button>
  <button class="nav-item" onclick="location.href='index.html#bookmarks'">
    <span class="nav-icon">🔖</span>
    <span class="nav-label">सेभ</span>
  </button>
  <button class="nav-item" onclick="location.href='index.html#random'">
    <span class="nav-icon">🎲</span>
    <span class="nav-label">अनियमित</span>
  </button>
  <button class="nav-item active">
    <span class="nav-icon">👤</span>
    <span class="nav-label">बारेमा</span>
  </button>
</nav>

<script src="data/about.js"></script>
<script src="js/theme.js"></script>
<script src="js/about.js"></script>
</body>
</html>
